name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: Imagens das bandeiras
        run: mkdir -p www/flags && cp node_modules/flag-icons/flags/4x3/*.svg www/flags/ && ls www/flags | wc -l
      - name: Compatibilidade Android 5.0
        run: sed -i 's/minSdkVersion = 22/minSdkVersion = 21/' android/variables.gradle && grep minSdk android/variables.gradle
      - name: Icone da app
        continue-on-error: true
        run: npx --yes @capacitor/assets@3.0.5 generate --android
      - name: Permitir motor de voz (Android 11+)
        run: sed -i 's#</manifest>#<queries><intent><action android:name="android.intent.action.TTS_SERVICE"/></intent></queries></manifest>#' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Bandeiras-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
